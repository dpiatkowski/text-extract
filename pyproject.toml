[project]
name = "text-extract"
version = "0.1.0"
description = "Extract text and tables from documents into other formats (PDF to Markdown by default)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pymupdf4llm>=0.0.17"]

[project.scripts]
text-extract = "text_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_extract"]
